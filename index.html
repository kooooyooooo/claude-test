<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Claude Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* Stars background */
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    /* Claude body */
    .scene {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .claude {
      position: relative;
      animation: float 3s ease-in-out infinite;
      cursor: pointer;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    /* Body */
    .body {
      width: 120px;
      height: 100px;
      background: linear-gradient(180deg, #d06410 0%, #b85010 100%);
      border-radius: 50px 50px 40px 40px;
      position: relative;
      margin-top: -10px;
    }

    /* Head */
    .head {
      width: 140px;
      height: 130px;
      background: linear-gradient(180deg, #e8821e 0%, #d06410 100%);
      border-radius: 70px 70px 55px 55px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    /* Ears */
    .ear {
      position: absolute;
      width: 30px;
      height: 35px;
      background: linear-gradient(180deg, #e8821e 0%, #d06410 100%);
      border-radius: 50%;
      top: 15px;
    }
    .ear.left { left: -12px; transform: rotate(-10deg); }
    .ear.right { right: -12px; transform: rotate(10deg); }
    .ear::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 20px;
      background: #ffb3c1;
      border-radius: 50%;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Face */
    .face {
      position: relative;
      width: 120px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Eyes */
    .eyes {
      position: absolute;
      top: 35px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 0 20px;
    }
    .eye {
      width: 22px;
      height: 22px;
      background: #2c1810;
      border-radius: 50%;
      position: relative;
      animation: blink 4s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    .eye::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      background: white;
      border-radius: 50%;
      top: 3px;
      right: 3px;
    }
    .eye-shine {
      position: absolute;
      width: 5px;
      height: 5px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      bottom: 4px;
      left: 3px;
    }

    /* Cheeks */
    .cheek {
      position: absolute;
      width: 28px;
      height: 16px;
      background: rgba(255, 150, 150, 0.5);
      border-radius: 50%;
      top: 62px;
    }
    .cheek.left { left: 12px; }
    .cheek.right { right: 12px; }

    /* Nose */
    .nose {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 8px;
      background: #9c4008;
      border-radius: 50%;
    }

    /* Mouth */
    .mouth {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 20px;
      overflow: hidden;
    }
    .mouth::before {
      content: '';
      position: absolute;
      width: 36px;
      height: 36px;
      border: 4px solid #c97854;
      border-radius: 50%;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      border-top-color: transparent;
      border-left-color: transparent;
      border-right-color: transparent;
    }

    /* Arms */
    .arms {
      position: absolute;
      width: 180px;
      top: 20px;
      display: flex;
      justify-content: space-between;
    }
    .arm {
      width: 28px;
      height: 70px;
      background: linear-gradient(180deg, #d06410 0%, #b85010 100%);
      border-radius: 14px;
    }
    .arm.left {
      transform: rotate(20deg);
      transform-origin: top center;
      animation: wave-left 3s ease-in-out infinite;
    }
    .arm.right {
      transform: rotate(-20deg);
      transform-origin: top center;
      animation: wave-right 3s ease-in-out infinite;
    }
    @keyframes wave-left {
      0%, 100% { transform: rotate(20deg); }
      50% { transform: rotate(35deg); }
    }
    @keyframes wave-right {
      0%, 100% { transform: rotate(-20deg); }
      50% { transform: rotate(-35deg); }
    }

    /* Antenna / symbol */
    .antenna {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 28px;
      background: #d06410;
      border-radius: 2px;
    }
    .antenna::after {
      content: '✦';
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      color: #ffd700;
      animation: spin-star 2s linear infinite;
      text-shadow: 0 0 10px #ffd700;
    }
    @keyframes spin-star {
      from { transform: translateX(-50%) rotate(0deg); }
      to { transform: translateX(-50%) rotate(360deg); }
    }

    /* Legs */
    .legs {
      display: flex;
      gap: 20px;
      margin-top: -5px;
    }
    .leg {
      width: 30px;
      height: 45px;
      background: linear-gradient(180deg, #b85010 0%, #9c4008 100%);
      border-radius: 15px 15px 20px 20px;
    }
    .leg.left { animation: leg-left 1.5s ease-in-out infinite; }
    .leg.right { animation: leg-right 1.5s ease-in-out infinite; }
    @keyframes leg-left {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes leg-right {
      0%, 100% { transform: rotate(5deg); }
      50% { transform: rotate(-5deg); }
    }

    /* Shadow */
    .shadow {
      width: 100px;
      height: 20px;
      background: rgba(0,0,0,0.3);
      border-radius: 50%;
      margin-top: 10px;
      animation: shadow-pulse 3s ease-in-out infinite;
    }
    @keyframes shadow-pulse {
      0%, 100% { transform: scaleX(0.9); opacity: 0.4; }
      50% { transform: scaleX(0.6); opacity: 0.2; }
    }

    /* Speech bubble */
    .bubble {
      position: absolute;
      top: -80px;
      right: -160px;
      background: white;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
      white-space: nowrap;
      opacity: 0;
      animation: bubble-appear 6s ease-in-out infinite;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .bubble::before {
      content: '';
      position: absolute;
      left: -10px;
      top: 50%;
      transform: translateY(-50%);
      border: 8px solid transparent;
      border-right-color: white;
    }
    @keyframes bubble-appear {
      0%, 20%, 80%, 100% { opacity: 0; transform: scale(0.8); }
      30%, 70% { opacity: 1; transform: scale(1); }
    }

    /* Messages rotation */
    .msg { display: none; }
    .msg.active { display: block; }

    /* Title */
    .title {
      color: white;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 40px;
      text-shadow: 0 0 20px rgba(255,200,100,0.8);
      letter-spacing: 2px;
      animation: title-glow 2s ease-in-out infinite;
    }
    @keyframes title-glow {
      0%, 100% { text-shadow: 0 0 20px rgba(255,200,100,0.5); }
      50% { text-shadow: 0 0 40px rgba(255,200,100,1), 0 0 60px rgba(255,150,50,0.5); }
    }

    /* Floating hearts on click */
    .heart {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      animation: fly-up 1.5s ease-out forwards;
    }
    @keyframes fly-up {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-150px) scale(1.5); }
    }

    /* Particles */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: particle-float var(--pdur) ease-out forwards;
    }
    @keyframes particle-float {
      0% { opacity: 0.8; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(0); }
    }

    .hint {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      margin-top: 50px;
      animation: hint-fade 2s ease-in-out infinite;
    }
    @keyframes hint-fade {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="title">✨ Hello, I'm Claude! ✨</div>

<div class="scene">
  <div class="claude" id="claude" title="クリックしてね！">
    <div style="position:relative; display:flex; flex-direction:column; align-items:center;">
      <!-- Speech bubble -->
      <div class="bubble" id="bubble">
        <span id="msg-text">こんにちは！</span>
      </div>

      <!-- Head -->
      <div class="head">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="antenna"></div>
        <div class="face">
          <div class="eyes">
            <div class="eye"><div class="eye-shine"></div></div>
            <div class="eye"><div class="eye-shine"></div></div>
          </div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="nose"></div>
          <div class="mouth"></div>
        </div>
      </div>

      <!-- Arms + Body -->
      <div style="position:relative;">
        <div class="arms">
          <div class="arm left"></div>
          <div class="arm right"></div>
        </div>
        <div class="body"></div>
      </div>

      <!-- Legs -->
      <div class="legs">
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>
    </div>
  </div>

  <div class="shadow"></div>
</div>

<div class="hint">クリックしてね ♪</div>

<script>
  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      --dur:${Math.random()*3+2}s;
      animation-delay:${Math.random()*3}s;
    `;
    starsEl.appendChild(s);
  }

  // Messages
  const messages = [
    'こんにちは！', 'Hello! 👋', 'どうぞよろしく！',
    'GitHub Pages, yay! 🎉', '何でも聞いてね！',
    'I\'m Claude! 🤖', 'ぴょんぴょん！', '✨ Magic! ✨'
  ];
  let msgIndex = 0;

  // Cycle messages in bubble
  setInterval(() => {
    msgIndex = (msgIndex + 1) % messages.length;
    document.getElementById('msg-text').textContent = messages[msgIndex];
  }, 6000);

  // Click handler
  document.getElementById('claude').addEventListener('click', (e) => {
    // Hearts
    const emojis = ['❤️', '💛', '💙', '💚', '💜', '⭐', '✨', '🌟'];
    for (let i = 0; i < 6; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        h.style.cssText = `
          left:${e.clientX + (Math.random()-0.5)*80}px;
          top:${e.clientY}px;
          animation-delay:${Math.random()*0.3}s;
        `;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1800);
      }, i * 60);
    }

    // Particles
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const colors = ['#ffd700','#ff6b9d','#a78bfa','#67e8f9','#86efac'];
      const size = Math.random()*8+4;
      const angle = (Math.PI * 2 * i) / 12;
      const dist = Math.random()*100+50;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        left:${e.clientX}px; top:${e.clientY}px;
        --px:${Math.cos(angle)*dist}px;
        --py:${Math.sin(angle)*dist}px;
        --pdur:${Math.random()*0.5+0.8}s;
      `;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1400);
    }

    // Bounce animation
    const claude = document.getElementById('claude');
    claude.style.animation = 'none';
    claude.style.transform = 'scale(1.2) rotate(-5deg)';
    setTimeout(() => {
      claude.style.transform = 'scale(0.95) rotate(3deg)';
      setTimeout(() => {
        claude.style.transform = '';
        claude.style.animation = '';
      }, 150);
    }, 150);

    // Show bubble with new message
    msgIndex = (msgIndex + 1) % messages.length;
    document.getElementById('msg-text').textContent = messages[msgIndex];
  });
</script>
</body>
</html>
